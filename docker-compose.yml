services:
  postgres:
    image: postgres:16-alpine
    container_name: sai_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-sai_qtrack_db}
      POSTGRES_USER: ${DB_USER:-sai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sai_secure_pwd}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sai_user} -d ${DB_NAME:-sai_qtrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
